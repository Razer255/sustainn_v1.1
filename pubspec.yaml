name: sustainn_farmer_app
description: Sustainn Farmer App — Farm management and advisory platform for smallholder farmers.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.1.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # Networking
  http: ^1.2.0

  # State Management
  provider: ^6.1.1

  # Localization
  easy_localization: ^3.0.3

  # UI & Fonts
  google_fonts: ^6.1.0

  # Utilities
  intl: ^0.20.2
  geolocator: ^11.0.0
  speech_to_text: ^7.5.0
  flutter_map: ^8.3.2
  latlong2: ^0.9.1
  flutter_local_notifications: ^17.0.0
  uuid: ^4.2.1

  # Local Storage / Offline
  hive: ^2.2.3
  hive_flutter: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  hive_generator: ^2.0.1
  build_runner: ^2.4.7
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true

  assets:
    - assets/translations/
    - assets/images/
    - assets/icon/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#1CBA6F"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  web:
    generate: true
    image_path: "assets/icon/app_icon.png"
    background_color: "#1CBA6F"
    theme_color: "#1CBA6F"
  windows:
    generate: true
    image_path: "assets/icon/app_icon.png"
  macos:
    generate: true
    image_path: "assets/icon/app_icon.png"
