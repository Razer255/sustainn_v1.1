name: sustainn_farmer_app
description: Sustainn Farmer App — Farm management and advisory platform for smallholder farmers.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.1.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # Firebase
  firebase_core: ^2.24.2
  firebase_auth: ^4.16.0
  cloud_firestore: ^4.14.0
  firebase_messaging: ^14.7.9

  # State Management
  provider: ^6.1.1

  # Localization
  easy_localization: ^3.0.3

  # UI & Fonts
  google_fonts: ^6.1.0

  # Utilities
  intl: ^0.20.2
  geolocator: ^11.0.0
  speech_to_text: ^6.6.0
  flutter_local_notifications: ^17.0.0
  uuid: ^4.2.1

  # Local Storage / Offline
  hive: ^2.2.3
  hive_flutter: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  hive_generator: ^2.0.1
  build_runner: ^2.4.7

flutter:
  uses-material-design: true

  assets:
    - assets/translations/
    - assets/images/
